name: Vendor React Aria Agent Skill

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  vendor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Vendor upstream React Aria Skill
        shell: bash
        run: |
          set -euo pipefail

          overlay_dir="$(mktemp -d)"
          if [ -f .agents/skills/react-aria/PROJECT-OVERLAY.md ]; then
            cp .agents/skills/react-aria/PROJECT-OVERLAY.md "$overlay_dir/PROJECT-OVERLAY.md"
          fi
          if [ -f .agents/skills/react-aria/UPSTREAM.md ]; then
            cp .agents/skills/react-aria/UPSTREAM.md "$overlay_dir/UPSTREAM.md"
          fi

          rm -rf .agents/skills/react-aria

          npx --yes skills@latest add https://react-aria.adobe.com \
            --skill react-aria \
            --copy \
            -a codex \
            -y

          test -f .agents/skills/react-aria/SKILL.md

          echo "Official upstream tree:"
          find .agents/skills/react-aria -type f | sort
          echo "File count: $(find .agents/skills/react-aria -type f | wc -l | tr -d ' ')"

          tar -czf /tmp/react-aria-upstream.tgz -C .agents/skills react-aria

      - name: Upload generated Skill tree
        uses: actions/upload-artifact@v4
        with:
          name: react-aria-upstream-tree
          path: /tmp/react-aria-upstream.tgz
      - name: Commit vendored Skill tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .agents/skills/react-aria
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(agent): vendor exact React Aria Skill tree"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
